<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — PingFox</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md">
    <div class="bg-slate-800 border border-slate-700 rounded-lg p-8 shadow-2xl">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-orange-500">🦊 PingFox</h1>
        <p class="text-slate-400 mt-2">Log in to your invoices</p>
      </div>

      {{if .Error}}
      <div class="mb-4 p-3 bg-red-900 border border-red-700 rounded text-red-100 text-sm">
        {{.Error}}
      </div>
      {{end}}

      <form method="POST" action="/login" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-slate-300 mb-1">Email</label>
          <input type="email" id="email" name="email" required 
            class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded text-white placeholder-slate-400 focus:border-orange-500 focus:outline-none"
            placeholder="you@example.com">
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-300 mb-1">Password</label>
          <input type="password" id="password" name="password" required 
            class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded text-white placeholder-slate-400 focus:border-orange-500 focus:outline-none"
            placeholder="your password">
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 font-semibold py-2 rounded transition">
            Log In
          </button>
        </div>
      </form>

      <div class="mt-6 pt-6 border-t border-slate-700">
        <p class="text-center text-slate-400 text-sm mb-4">Or log in with</p>
        <div class="flex gap-3">
          <a href="/auth/google/start" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2 rounded text-center text-sm font-medium transition">
            Google
          </a>
          <a href="/auth/github/start" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2 rounded text-center text-sm font-medium transition">
            GitHub
          </a>
        </div>
      </div>

      <p class="text-center text-slate-400 text-sm mt-6">
        Don't have an account? <a href="/signup" class="text-orange-500 hover:text-orange-400 font-medium">Sign up</a>
      </p>
    </div>
  </div>
</body>
</html>
